<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11.3 游标卡尺</title>
<meta property="og:title" content="11.3 游标卡尺">
<meta property="og:description" content="可交互 GeoGebra 课件">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GeoGebra 课件">
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{display:flex;align-items:center;justify-content:center;height:100%}
  .box{position:relative;border:0;}
  #ggb{width:800px;height:600px}
  #ggb,#ggb *{border:none!important;box-shadow:none!important;outline:none!important}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,0.92);cursor:pointer;z-index:10}
  #overlay .btn{padding:12px 28px;border:0;border-radius:4px;background:#2D8CF0;color:#fff;font-size:15px;cursor:pointer}
  #loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#888;font-size:14px;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <div id="ggb"></div>
    <div id="loading">正在加载课件，请稍候…</div>
    <div id="overlay"><span class="btn">▶ 点击运行</span></div>
  </div>
</div>
<script>
(function () {
  var params = {
    appName: "classic",
    width: 800,
    height: 600,
    filename: "https://gcore.jsdelivr.net/gh/wys1987/Venus@main/GGB/bbba8a4cc8ff/11.3%20%E6%B8%B8%E6%A0%87%E5%8D%A1%E5%B0%BA.ggb",
    showToolBar: false,
    showMenuBar: false,
    showAlgebraInput: false,
    allowStyleBar: false,
    showFullscreenButton: true,
    showResetIcon: true,
    enableRightClick: true,
    enableShiftDragZoom: false,
    borderColor: "#ffffff",
    buttonBorderColor: "#cbd5e1",
    buttonShadows: false,
    appletOnLoad: function (api) {
      var l = document.getElementById("loading");
      if (l) l.style.display = "none";
      if (!api || !api.setPerspective) return;
      // 强制只显示绘图区：文件可能自带「代数+绘图」分栏，加载后会覆盖，需延迟重设
      var setG = function () {
        try { api.setPerspective("G"); } catch (e) {}
      };
      setG();
      setTimeout(setG, 600);
      setTimeout(setG, 1600);
    }
  };
  function inject() {
    var o = document.getElementById("overlay");
    if (o) o.style.display = "none";
    var applet = new GGBApplet(params, true);
    applet.inject("ggb");
  }
  inject();
})();
</script>
</body>
</html>
