<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.2 x-t图像</title>
<meta property="og:title" content="1.2 x-t图像">
<meta property="og:description" content="可交互 GeoGebra 课件">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GeoGebra 课件">
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<style>
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  #ggb{width:100vw;height:100vh}
  #loading{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#888;font-size:16px;z-index:10}
</style>
</head>
<body>
<div id="ggb"></div>
<div id="loading">正在加载课件，请稍候…</div>
<script>
(function () {
  var params = {
    appName: "classic",
    width: window.innerWidth,
    height: window.innerHeight,
    filename: "https://cdn.jsdelivr.net/gh/wys1987/Venus@main/GGB/545366485952/1.2%20x-t%E5%9B%BE%E5%83%8F.ggb",
    showToolBar: false,
    showAlgebraInput: false,
    showMenuBar: false,
    showResetIcon: false,
    enableRightClick: false,
    errorDialogsActive: true,
    appletOnLoad: function (api) {
      var l = document.getElementById("loading");
      if (l) l.style.display = "none";
      // 课件可能以「图形区 + 空白的图形区2」双视图保存，导致画面被劈成两半、
      // 右侧空白。这里强制切回单一图形区（G），去掉分割线和空白右侧。
      if (api && api.setPerspective) {
        try { api.setPerspective("G"); } catch (e) {}
      }
    }
  };
  var applet = new GGBApplet(params, true);
  applet.inject("ggb");
})();
</script>
</body>
</html>
