<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.3 匀速车上跳起</title>
<meta property="og:title" content="1.3 匀速车上跳起">
<meta property="og:description" content="可交互 GeoGebra 课件">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GeoGebra 课件">
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{display:flex;align-items:center;justify-content:center;height:100%}
  .box{position:relative;border:1px solid #e5e7eb;}
  #ggb{width:801px;height:525px}
  #overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.92);cursor:pointer;z-index:10}
  #overlay .btn{padding:12px 28px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;color:#334155;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,0.08)}
  #loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#888;font-size:14px;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <div id="ggb"></div>
    <div id="loading">正在加载课件，请稍候…</div>
    <div id="overlay"><span class="btn">▶ 点击运行</span></div>
  </div>
</div>
<script>
(function () {
  var params = {
    appName: "classic",
    width: 801,
    height: 525,
    filename: "https://gcore.jsdelivr.net/gh/wys1987/Venus@main/GGB/08cacf485be1/1.3%20%E5%8C%80%E9%80%9F%E8%BD%A6%E4%B8%8A%E8%B7%B3%E8%B5%B7.ggb",
    showToolBar: false,
    showMenuBar: false,
    showAlgebraInput: false,
    allowStyleBar: false,
    showFullscreenButton: true,
    showResetIcon: true,
    enableRightClick: true,
    enableShiftDragZoom: true,
    appletOnLoad: function (api) {
      var l = document.getElementById("loading");
      if (l) l.style.display = "none";
      if (api && api.setPerspective) {
        try { api.setPerspective("G"); } catch (e) {}
      }
    }
  };
  function inject() {
    var o = document.getElementById("overlay");
    if (o) o.style.display = "none";
    var applet = new GGBApplet(params, true);
    applet.inject("ggb");
  }
  document.getElementById("overlay").addEventListener("click", inject);
})();
</script>
</body>
</html>
